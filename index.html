<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>World Wine Wide - Interactive Wine Maps</title>
  <meta name="description" content="Interactive maps of official wine regions across the world built from authoritative geographic boundaries and legal specifications.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🍷</text></svg>">
  
  <!-- MapLibre GL JS -->
  <link rel="stylesheet" href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" />
  <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>

  <!-- Custom Styles -->
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">
    <!-- Header / Navbar -->
    <header class="top-nav">
      <div class="brand">
        <span class="brand-icon">🍷</span>
        <div>
          <h1 class="brand-title" id="brand-title">World Wine Wide</h1>
          <div class="brand-subtitle" id="brand-subtitle">Official Wine Region Maps</div>
        </div>
      </div>
      <div class="nav-actions">
        <!-- Selector de Mapa de Referencia (Basemap) -->
        <div class="basemap-selector-wrap">
          <span class="basemap-label" id="lbl-basemap" title="Reference Basemap">🗺️</span>
          <select id="basemap-select" class="basemap-select" title="Change reference basemap">
            <option value="voyager" id="bm-voyager-opt">Voyager (Color)</option>
            <option value="positron" id="bm-positron-opt">Light (Positron)</option>
            <option value="dark" id="bm-dark-opt">Dark (Dark Matter)</option>
            <option value="satellite" id="bm-satellite-opt">Satellite (ESRI)</option>
            <option value="topo" id="bm-topo-opt">Topographic (Relief)</option>
            <option value="osm" id="bm-osm-opt">OpenStreetMap</option>
          </select>
        </div>

        <!-- Link to Grape Varieties Explorer -->
        <a href="grapes.html" class="btn-link btn-grapes" id="nav-btn-grapes" title="Grape Varieties Explorer">
          <span>🍇</span> <span id="nav-grapes-text">Grape Varieties</span>
        </a>

        <button class="lang-btn" data-lang="es">ES</button>
        <button class="lang-btn active" data-lang="en">EN</button>
        <a href="https://app.atlas.co/projects/iRfhgtNFAbVm6zHZL3bN?loc=-2.7334%2C39.9785%2C6.0441z" target="_blank" rel="noopener noreferrer" class="btn-link btn-atlas">
          <span>🗺️</span> Atlas.co
        </a>
        <a href="https://github.com/jreyes13/wine_world_wide" target="_blank" rel="noopener noreferrer" class="btn-link btn-github">
          <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
            <path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"></path>
          </svg>
          GitHub
        </a>
      </div>
    </header>

    <!-- Main Workspace -->
    <main class="main-content">
      <!-- Interactive Map -->
      <div id="map"></div>

      <!-- Left Sidebar Search & Explorer -->
      <aside class="sidebar" id="sidebar">
        <!-- Sidebar Collapse / Expand Toggle Button -->
        <button class="sidebar-toggle" id="sidebar-toggle" title="Hide sidebar" aria-label="Toggle Sidebar">
          <span class="toggle-icon" id="sidebar-toggle-icon">◀</span>
        </button>

        <div class="sidebar-header">
          <div class="search-box">
            <span class="search-icon">🔍</span>
            <input type="text" id="search-input" class="search-input" placeholder="Search by Appellation, Country, Region, Grape or Municipality..." autocomplete="off">
          </div>
          <div class="filters-row">
            <select id="country-filter" class="filter-select">
              <option value="" id="country-all-opt">All Countries</option>
              <option value="Armenia" id="country-am-opt">🇦🇲 Armenia</option>
              <option value="Austria" id="country-at-opt">🇦🇹 Austria</option>
              <option value="Bulgaria" id="country-bg-opt">🇧🇬 Bulgaria</option>
              <option value="Croacia" id="country-hr-opt">🇭🇷 Croatia</option>
              <option value="Chipre" id="country-cy-opt">🇨🇾 Cyprus</option>
              <option value="República Checa" id="country-cz-opt">🇨🇿 Czech Republic</option>
              <option value="Francia" id="country-fr-opt">🇫🇷 France</option>
              <option value="Georgia" id="country-ge-opt">🇬🇪 Georgia</option>
              <option value="Alemania" id="country-de-opt">🇩🇪 Germany</option>
              <option value="Grecia" id="country-gr-opt">🇬🇷 Greece</option>
              <option value="Hungría" id="country-hu-opt">🇭🇺 Hungary</option>
              <option value="Italia" id="country-it-opt">🇮🇹 Italy</option>
              <option value="Líbano" id="country-lb-opt">🇱🇧 Lebanon</option>
              <option value="Moldavia" id="country-md-opt">🇲🇩 Moldova</option>
              <option value="Portugal" id="country-pt-opt">🇵🇹 Portugal</option>
              <option value="Rumanía" id="country-ro-opt">🇷🇴 Romania</option>
              <option value="Eslovaquia" id="country-sk-opt">🇸🇰 Slovakia</option>
              <option value="Eslovenia" id="country-si-opt">🇸🇮 Slovenia</option>
              <option value="España" id="country-es-opt">🇪🇸 Spain</option>
              <option value="Suiza" id="country-ch-opt">🇨🇭 Switzerland</option>
            </select>
            <select id="category-filter" class="filter-select">
              <option value="" id="cat-all-opt">All Classifications</option>
            </select>
            <select id="region-filter" class="filter-select">
              <option value="" id="reg-all-opt">All Regions</option>
            </select>
          </div>
        </div>

        <div class="regions-counter">
          <span id="count-badge">Loading appellations...</span>
        </div>

        <div class="regions-list" id="regions-list"></div>
      </aside>

      <!-- Right Detail Panel (Floating) -->
      <section class="detail-panel" id="detail-panel" aria-label="Appellation Details">
        <button class="detail-close" id="btn-close-detail" title="Close">&times;</button>
        <div class="detail-header">
          <span class="detail-badge" id="detail-badge">DO</span>
          <h2 class="detail-title" id="detail-title"></h2>
          <div class="detail-region" id="detail-region"></div>
        </div>
        <div class="detail-body">
          <div class="info-item">
            <div class="info-label" id="lbl-territory">Territorial Scope</div>
            <div class="info-value" id="detail-munis"></div>
            <!-- Desplegable interactivo de municipios -->
            <details class="munis-dropdown" id="munis-dropdown">
              <summary class="munis-summary" id="munis-summary">
                <span id="lbl-toggle-munis">View municipalities / communes</span>
                <span class="summary-arrow">▾</span>
              </summary>
              <div class="munis-container">
                <input type="text" id="munis-search" class="munis-search-input" placeholder="Search municipality / commune..." autocomplete="off">
                <div class="munis-chips" id="munis-chips"></div>
              </div>
            </details>
          </div>
          <div class="info-item">
            <div class="info-label" id="lbl-grapes-red">Key Red Varieties</div>
            <div class="info-value" id="detail-grapes-red"></div>
          </div>
          <div class="info-item">
            <div class="info-label" id="lbl-grapes-white">Key White Varieties</div>
            <div class="info-value" id="detail-grapes-white"></div>
          </div>
        </div>
        <div class="detail-actions">
          <a href="#" target="_blank" rel="noopener noreferrer" class="btn-action btn-pliego" id="btn-pliego">
            <span id="btn-pliego-txt">📄 View Official Specifications (PDF)</span>
          </a>
        </div>
      </section>
    </main>
  </div>

  <!-- Capa de datos (compatible directamente con doble clic file:// y con servidor web http://) -->
  <script src="data/spain_wine_regions.js"></script>
  <script src="app.js"></script>
</body>
</html>
